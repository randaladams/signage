name: Deploy server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

concurrency: deploy-server

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install --no-audit --no-fund

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Ensure R2 bucket exists
        run: |
          if npx wrangler r2 bucket list | grep -q "signage-images"; then
            echo "Bucket exists"
          else
            npx wrangler r2 bucket create signage-images
          fi

      - name: Ensure D1 database exists
        run: |
          find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name=="signage") | (.uuid // .id)' | head -n1; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler d1 create signage
            ID=$(find_id)
          fi
          if [ -z "$ID" ]; then echo "::error::Could not find or create the D1 database"; exit 1; fi
          sed -i "s/__D1_DATABASE_ID__/$ID/g" wrangler.toml

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply signage --remote --env device

      - name: Deploy device API
        run: npx wrangler deploy --env device

      - name: Deploy admin page
        env:
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
        run: |
          if [ -n "$ACCESS_TEAM_DOMAIN" ] && [ -n "$ACCESS_AUD" ]; then
            npx wrangler deploy --env admin --var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN" --var "ACCESS_AUD:$ACCESS_AUD"
          else
            echo "::warning::ACCESS_TEAM_DOMAIN / ACCESS_AUD repo variables are not set. The admin page is deployed but stays locked until they are (README step 4)."
            npx wrangler deploy --env admin
          fi

      - name: Show URLs
        run: |
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          {
            echo "### Deployed"
            echo "- Admin page: https://signage-admin.$SUB.workers.dev"
            echo "- Device API: https://signage-device.$SUB.workers.dev"
          } >> "$GITHUB_STEP_SUMMARY"
